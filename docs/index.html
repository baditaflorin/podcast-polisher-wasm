<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast Polisher WASM</title>
    <meta
      name="description"
      content="Browser-only podcast post-production with noise reduction, cleanup, and EBU R128 loudness normalization."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172026;
        background: #f8f5ef;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(880px, calc(100vw - 32px));
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        margin: 0 0 16px;
      }

      p {
        max-width: 680px;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      a {
        color: #005f73;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Podcast Polisher WASM</h1>
      <p>
        Static GitHub Pages scaffold is live. The full browser-based audio
        post-production app is being built in follow-up commits.
      </p>
      <p>
        Repo:
        <a href="https://github.com/baditaflorin/podcast-polisher-wasm"
          >https://github.com/baditaflorin/podcast-polisher-wasm</a
        >
      </p>
    </main>
  </body>
</html>
